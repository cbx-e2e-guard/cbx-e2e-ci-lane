# CBX Guard CI plan check as a GitHub composite action (CB-923 / IAM-26). It downloads the pinned
# cloudguard release binary (ci/cli-release.yml), verifies its SHA-256, and runs
# `cloudguard check <plan> --remote`. The step fails when a finding gates the change (exit 1) and on
# a usage, auth or transport error (exit 2).
#
# GitHub resolves `uses: owner/repo/path@ref` on github.com only, and this repository lives on
# GitLab. Each release publishes this file as cbx-guard-action.yml to the public package registry,
# next to the binaries (ci/templates/public-release.ts), so copying it needs no token. Copy it into
# the workflow repository (for example to .github/actions/cbx-guard/action.yml) and call it with
# `uses: ./.github/actions/cbx-guard`. Set-up: docs/customer/ci-plan-upload.md. Usage, tokens and
# exit codes: docs/ci-plan-ingest.md.
name: CBX Guard plan check
description: Run cloudguard check --remote on a Terraform plan JSON and gate the job on the verdict.
author: CloudBooster
branding:
  icon: shield
  color: blue

inputs:
  plan-path:
    description: The plan JSON, e.g. from `terraform show -json tfplan > plan.json`.
    required: true
  api-url:
    description: The CBX Guard API base URL, e.g. https://guard.example.com.
    required: true
  token:
    description: A CBX Guard API token with the `ingest` scope. Pass a secret.
    required: true
  account:
    description: The cloud account the plan targets. It must be connected to the token's org.
    required: true
  fail-on:
    description: >-
      An override of the gate: critical | high | watch | clean, a floor (that tier or worse fails the
      step). Empty, the step fails on the tiers the repository's gate blocks, as the posted
      cbxguard/ci-plan check does, and on critical without a pull request or a watched repository.
    required: false
    default: ""
  version:
    description: The cloudguard release tag, e.g. v1.2.3.
    required: true
  sha256:
    description: >-
      The binary's expected SHA-256 (its line in the release's SHA256SUMS). Without it, the binary is
      checked against SHA256SUMS from the same registry.
    required: false
    default: ""
  download-token:
    description: >-
      Not needed for the public registry. A token for a private mirror of it (download-url), sent
      as PRIVATE-TOKEN. Pass a secret.
    required: false
    default: ""
  download-url:
    description: The generic package registry the release publishes to. Set it only for a mirror.
    required: false
    default: https://gitlab.com/api/v4/projects/cloudbooster.io%2Fplatform%2Fcbx-guard/packages/generic/cloudguard
  args:
    description: Extra cloudguard flags, e.g. "--region eu-central-1 --json".
    required: false
    default: ""

runs:
  using: composite
  steps:
    # First, so a run without secrets stops here with exit 2. A fork's pull_request run has none, and
    # without the download token a private mirror would otherwise fail the download with curl's
    # own exit code, before anything says the token is missing (DEV-095).
    - name: Check the token
      shell: bash
      env:
        CBX_GUARD_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "$CBX_GUARD_TOKEN" ]; then
          echo "::error title=cbx-guard::the token input is empty: pass a secret with the ingest scope (a pull request from a fork gets no secrets)"
          exit 2
        fi
        echo "::add-mask::$CBX_GUARD_TOKEN"

    - name: Download and verify cloudguard
      id: download
      shell: bash
      env:
        CBX_GUARD_VERSION: ${{ inputs.version }}
        CBX_GUARD_SHA256: ${{ inputs.sha256 }}
        CBX_GUARD_DOWNLOAD_TOKEN: ${{ inputs.download-token }}
        CBX_GUARD_DOWNLOAD_URL: ${{ inputs.download-url }}
      run: |
        set -euo pipefail
        cbx_fail() { echo "::error title=cbx-guard::$*"; exit 2; }
        [ -z "$CBX_GUARD_DOWNLOAD_TOKEN" ] || echo "::add-mask::$CBX_GUARD_DOWNLOAD_TOKEN"
        echo "$CBX_GUARD_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' ||
          cbx_fail "version must be a cloudguard release tag like v1.2.3 (got '$CBX_GUARD_VERSION')"
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=cloudguard-linux-x64 ;;
          Linux/ARM64) asset=cloudguard-linux-arm64 ;;
          macOS/X64) asset=cloudguard-darwin-x64 ;;
          macOS/ARM64) asset=cloudguard-darwin-arm64 ;;
          *) cbx_fail "no cloudguard binary for $RUNNER_OS/$RUNNER_ARCH" ;;
        esac
        if command -v sha256sum > /dev/null; then sha=(sha256sum); else sha=(shasum -a 256); fi

        # fetch <url> <file>: the registry credential goes to the registry only. A redirect (to
        # object storage) is followed in a second request that carries no credential.
        fetch() {
          local next
          if [ -n "$CBX_GUARD_DOWNLOAD_TOKEN" ]; then
            next=$(curl -fsS --proto '=https' --retry 3 -H "PRIVATE-TOKEN: $CBX_GUARD_DOWNLOAD_TOKEN" -o "$2" -w '%{redirect_url}' "$1")
          else
            next=$(curl -fsS --proto '=https' --retry 3 -o "$2" -w '%{redirect_url}' "$1")
          fi
          if [ -n "$next" ]; then
            curl -fsSL --proto '=https' --retry 3 -o "$2" "$next"
          fi
        }

        # verify <dir> <sums> <file>: <dir>/<file> must have its own line in <dir>/<sums> (GNU
        # "hash  file" or binary-mode "hash *file", LF or CRLF) and match it. No line is a failure.
        verify() {
          awk -v f="$3" '{ sub(/\r$/, "") } length($1) == 64 && ($2 == f || $2 == "*" f) { print $1 "  " f }' \
            "$1/$2" > "$1/$3.sha256"
          [ -s "$1/$3.sha256" ] || cbx_fail "$2 has no SHA-256 line for $3"
          (cd "$1" && "${sha[@]}" -c "$3.sha256")
        }

        dir="$RUNNER_TEMP/cbx-guard"
        mkdir -p "$dir"
        registry="${CBX_GUARD_DOWNLOAD_URL%/}/$CBX_GUARD_VERSION"
        fetch "$registry/$asset" "$dir/$asset"
        if [ -n "$CBX_GUARD_SHA256" ]; then
          echo "$CBX_GUARD_SHA256  $asset" > "$dir/SHA256SUMS"
        else
          fetch "$registry/SHA256SUMS" "$dir/SHA256SUMS"
        fi
        verify "$dir" SHA256SUMS "$asset"
        chmod +x "$dir/$asset"
        got=$("$dir/$asset" --version)
        [ "$got" = "cloudguard $CBX_GUARD_VERSION" ] ||
          cbx_fail "the binary reports '$got', not 'cloudguard $CBX_GUARD_VERSION'"
        echo "$got"
        echo "bin=$dir/$asset" >> "$GITHUB_OUTPUT"

    - name: cloudguard check --remote
      shell: bash
      env:
        CLOUDGUARD: ${{ steps.download.outputs.bin }}
        CBX_GUARD_TOKEN: ${{ inputs.token }}
        CBX_GUARD_API_URL: ${{ inputs.api-url }}
        CBX_GUARD_PLAN: ${{ inputs.plan-path }}
        CBX_GUARD_ACCOUNT: ${{ inputs.account }}
        CBX_GUARD_FAIL_ON: ${{ inputs.fail-on }}
        CBX_GUARD_ARGS: ${{ inputs.args }}
      # The CLI reads CBX_GUARD_TOKEN and CBX_GUARD_API_URL from the environment, and finds the pull
      # request from GITHUB_REPOSITORY and the GITHUB_EVENT_PATH payload.
      run: |
        set -euo pipefail
        # No --fail-on unless set: the API then gates on the repository's gate tiers (CB-1048).
        fail_on=""
        if [ -n "$CBX_GUARD_FAIL_ON" ]; then
          case "$CBX_GUARD_FAIL_ON" in
            critical | high | watch | clean) fail_on="--fail-on $CBX_GUARD_FAIL_ON" ;;
            *)
              echo "::error title=cbx-guard::fail-on must be critical, high, watch or clean, or empty (got '$CBX_GUARD_FAIL_ON')"
              exit 2
              ;;
          esac
        fi
        # shellcheck disable=SC2086 # fail_on and CBX_GUARD_ARGS are lists of flags.
        "$CLOUDGUARD" check "$CBX_GUARD_PLAN" --remote --account "$CBX_GUARD_ACCOUNT" $fail_on $CBX_GUARD_ARGS
